<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>방울이의 물길 탐험 · 새 버전 열기</title>
 <style>
  @font-face{font-family:NanumSquareNeo;src:url(/assets/fonts/NanumSquareNeoTTF-bRg.woff2) format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:NanumSquareNeo;src:url(/assets/fonts/NanumSquareNeoTTF-cBd.woff2) format("woff2");font-weight:700;font-display:swap}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#edf6ed;color:#214f51;font:18px/1.6 NanumSquareNeo,system-ui,sans-serif}
  main{max-width:560px;padding:32px;text-align:center}h1{font-size:28px}button{min-height:48px;padding:12px 24px;background:#175e58;color:#fff;border:0;border-radius:12px;font:inherit;cursor:pointer}
 </style>
</head>
<body>
 <main><h1>방울이의 새 탐험을 준비하고 있어</h1><p id="status" role="status">저장한 탐험 기록을 이어서 최신 버전으로 열고 있어.</p><button id="retry" hidden>다시 연결하기</button></main>
 <script>
  const status=document.querySelector('#status'),retry=document.querySelector('#retry');
  async function openLatest(){
   retry.hidden=true;
   status.textContent='저장한 탐험 기록을 이어서 최신 버전으로 열고 있어.';
   try{
    if(!('serviceWorker' in navigator)){location.replace('/');return;}
    const registration=await navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'});
    await registration.update();
    const worker=registration.installing||registration.waiting||registration.active;
    if(!worker)throw new Error('worker unavailable');
    await new Promise((resolve,reject)=>{
     const changed=()=>{
      if(worker.state==='installed')worker.postMessage('skip-waiting');
      if(worker.state==='activated'){worker.removeEventListener('statechange',changed);resolve();}
      if(worker.state==='redundant'){worker.removeEventListener('statechange',changed);reject(new Error('update failed'));}
     };
     worker.addEventListener('statechange',changed);changed();
    });
    location.replace('/');
   }catch{
    status.textContent='새 버전에 연결하지 못했어. 인터넷 연결을 확인하고 다시 눌러 줘.';
    retry.hidden=false;
   }
  }
  retry.addEventListener('click',openLatest);openLatest();
 </script>
</body>
</html>
