<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123e60">
  <meta name="description" content="직접 관찰하고 실험해서 멈춘 연구실의 물길을 복구하는 과학 탐험, 물방울 연구실.">
  <title>물방울 연구실 · Science World</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%230fa5ce' d='M20 2C15 12 5 20 5 27a15 15 0 0030 0C35 20 25 12 20 2'/%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <style>
    #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-content:center;justify-items:center;gap:16px;padding:24px;background:#f5efdc;color:#123e60;font:700 clamp(18px,2.4vw,24px)/1.4 system-ui,sans-serif;text-align:center;transition:opacity .35s ease}
    #boot img{width:88px;height:auto;animation:boot-bob 1.4s ease-in-out infinite alternate}
    #boot p{margin:0}
    .boot-bar{width:min(280px,72vw);height:14px;border-radius:99px;background:#e2e9e4;box-shadow:inset 0 1px 3px #123e6026;overflow:hidden}
    .boot-bar i{display:block;width:4%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#46b6c5,#137da7);transition:width .3s ease}
    #boot.done{opacity:0;pointer-events:none}
    @keyframes boot-bob{to{transform:translateY(-6px)}}
    @media (prefers-reduced-motion:reduce){#boot,.boot-bar i{transition:none}#boot img{animation:none}}
  </style>
  <noscript><style>#boot{display:none}</style></noscript>
  <script>
    // Loading bar: each step is a real resource finishing (font, Phaser, app modules, first screen image).
    (()=>{const weight={font:15,engine:45,app:15,screen:25},done=new Set();let gone=false,finish;window.bootDone=new Promise(r=>finish=r);
      const hide=()=>{const el=document.getElementById('boot');if(gone||!el)return;gone=true;finish();el.classList.add('done');setTimeout(()=>el.remove(),matchMedia('(prefers-reduced-motion: reduce)').matches?0:400);};
      const draw=()=>{const el=document.getElementById('boot');if(!el)return;const p=[...done].reduce((s,k)=>s+weight[k],0);el.querySelector('.boot-bar i').style.width=Math.max(4,p)+'%';el.querySelector('.boot-bar').setAttribute('aria-valuenow',p);if(done.size===4)hide();};
      window.bootStep=k=>{if(k in weight){done.add(k);draw();}};
      document.addEventListener('DOMContentLoaded',draw);addEventListener('load',()=>setTimeout(hide,800));})();
  </script>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="preload" href="/assets/fonts/jua-korean-400.woff2" as="font" type="font/woff2" crossorigin onload="bootStep('font')" onerror="bootStep('font')">
  <link rel="stylesheet" href="/src/v2.css">
  <link rel="stylesheet" href="/src/activities.css">
  <link rel="stylesheet" href="/src/inquiry.css">
  <link rel="stylesheet" href="/src/tablet.css">
  <link rel="stylesheet" href="/src/experience.css">
  <script defer src="/assets/vendor/phaser.min.js" onload="bootStep('engine')" onerror="bootStep('engine')"></script>
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <div id="boot" role="status"><img src="/assets/icons/bangul-loader.webp" width="88" height="110" alt=""><p>방울이의 연구섬을 준비하고 있어…</p><div class="boot-bar" role="progressbar" aria-label="불러오는 중" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div></div>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript>이 실험실을 이용하려면 JavaScript를 켜 줘.</noscript>
</body>
</html>
