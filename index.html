<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123e60">
  <meta name="description" content="방울이와 물을 붓고 얼리고 녹이며 증발과 응결을 관찰해 멈춘 연구섬의 물길을 되살리는 초등 4학년 과학 탐험.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="방울이의 물길 탐험">
  <meta property="og:title" content="방울이의 물길 탐험">
  <meta property="og:description" content="얼고, 마르고, 다시 맺히는 물의 비밀로 멈춘 물길을 다시 흐르게 해 줘! 초등 4학년 과학 「물의 상태 변화」">
  <meta property="og:url" content="https://water-state-lab.pages.dev/">
  <meta property="og:image" content="https://water-state-lab.pages.dev/assets/icons/og-image-v1.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="방울이의 물길 탐험 로고와 돋보기를 든 물방울 방울이">
  <meta name="twitter:card" content="summary_large_image">
  <title>방울이의 물길 탐험 · 물방울 연구실</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%230fa5ce' d='M20 2C15 12 5 20 5 27a15 15 0 0030 0C35 20 25 12 20 2'/%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <style>
    #boot{min-height:100svh;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;background:#f5efdc;color:#123e60;font:700 clamp(18px,2.4vw,24px)/1.4 NanumSquareNeo,system-ui,sans-serif;text-align:center}
    #boot p{margin:0}
    #boot-retry{min-height:48px;font:inherit}
  </style>
  <noscript><style>#boot{display:none}</style></noscript>
  <script>
    (()=>{let finish;window.bootDone=new Promise(resolve=>finish=resolve);
      const showError=()=>{const boot=document.getElementById('boot');if(!boot)return;
        boot.querySelector('p').textContent='연구섬을 열지 못했어. 다시 열어 볼까?';
        boot.querySelector('button').hidden=false;};
      const timeout=setTimeout(showError,12000);
      window.bootError=showError;
      window.bootReady=()=>{clearTimeout(timeout);document.getElementById('boot')?.remove();finish();};})();
  </script>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="preload" href="/assets/fonts/NanumSquareNeoTTF-bRg.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/v2.css">
  <link rel="stylesheet" href="/src/activities.css">
  <link rel="stylesheet" href="/src/inquiry.css">
  <link rel="stylesheet" href="/src/tablet.css">
  <link rel="stylesheet" href="/src/experience.css">
  <link rel="stylesheet" href="/src/freeze-bench.css">
  <link rel="stylesheet" href="/src/observation-upgrade.css">
  <link rel="stylesheet" href="/src/freeze-tray.css">
  <link rel="stylesheet" href="/src/transform-process.css">
  <link rel="stylesheet" href="/src/process-upgrades.css">
  <link rel="stylesheet" href="/src/guided-experience.css">
  <link rel="stylesheet" href="/src/scenic-glass.css">
  <link rel="stylesheet" href="/src/npc-dialogue.css">
  <script type="module" src="/src/app.js" onerror="bootError()"></script>
  <link rel="stylesheet" href="/src/drop-adventure.css">
<link rel="stylesheet" href="/src/resident-stage.css">
</head>
<body>
  <div id="boot"><p role="status">방울이의 연구섬을 여는 중…</p><button type="button" id="boot-retry" hidden onclick="location.reload()">다시 열기</button></div>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript>이 실험실을 이용하려면 JavaScript를 켜 줘.</noscript>
</body>
</html>
